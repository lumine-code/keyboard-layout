name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev xkb-data x11-xkb-utils xvfb
      - name: Install dependencies
        run: npm ci
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run tests on macOS and Windows
        if: runner.os != 'Linux'
        run: npm test
      - name: Validate package contents
        run: npm pack --dry-run
      # Match the Electron version currently used by Lumine. The Node-API
      # addon built above must also survive real renderer environment teardown.
      - name: Install Electron for renderer lifecycle tests
        run: npm install --prefix "${{ runner.temp }}/keyboard-layout-electron" --no-save --no-package-lock --no-audit --no-fund electron@45.0.0
      - name: Test Electron renderer reloads on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node "${{ runner.temp }}/keyboard-layout-electron/node_modules/electron/cli.js" spec/electron-smoke.js --no-sandbox
      - name: Test Electron renderer reloads on macOS and Windows
        if: runner.os != 'Linux'
        run: node "${{ runner.temp }}/keyboard-layout-electron/node_modules/electron/cli.js" spec/electron-smoke.js
